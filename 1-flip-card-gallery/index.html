<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip 🍣</title>
  <link rel="stylesheet" type="text/css" href="index.css">
  <script type="text/javascript" src="index.js"></script>
</head>
<body>
  <div class="card-container">
    <div class="flipcard">
      <div class="flipcard-inner">
        <div class="flipcard-front">
          🕷️
        </div>
        <div class="flipcard-back">
          <h1>Con nhện</h1>
          <p>Con nhện nâng cao</p>
        </div>
      </div>
    </div>

    <div class="flipcard">
      <div class="flipcard-inner">
        <div class="flipcard-front">
          🐧
        </div>
        <div class="flipcard-back">
          <h1>Penguin</h1>
          <p>🐧🐧🐧🐧🐧</p>
        </div>
      </div>
    </div>

    <div class="flipcard">
      <div class="flipcard-inner">
        <div class="flipcard-front">
          💥
        </div>
        <div class="flipcard-back">
          <button onclick="playAudio()">Boom</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
