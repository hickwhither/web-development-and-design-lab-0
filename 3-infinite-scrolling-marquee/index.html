<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite Scrolling Marquee</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <section class="marquee-section">
    <h1>Infinite Scrolling Marquee</h1>
    <div class="marquee" aria-label="Scrolling banner">
      <div class="marquee-track">
        <div class="marquee-item">HTML</div>
        <div class="marquee-item">CSS</div>
        <div class="marquee-item">JavaScript</div>
        <div class="marquee-item">React</div>
        <div class="marquee-item">Vue</div>
        <div class="marquee-item">Node.js</div>

        <div class="marquee-item">HTML</div>
        <div class="marquee-item">CSS</div>
        <div class="marquee-item">JavaScript</div>
        <div class="marquee-item">React</div>
        <div class="marquee-item">Vue</div>
        <div class="marquee-item">Node.js</div>
      </div>
    </div>
  </section>
</body>
</html>
